services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: hotelpro-app
        container_name: hotelpro_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
        networks:
            - hotelpro-net

    webserver:
        image: nginx:alpine
        container_name: hotelpro_webserver
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/conf.d:/etc/nginx/conf.d
        networks:
            - hotelpro-net

    db:
        image: mysql:8.0
        container_name: hotelpro_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: MiProyecto
            MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
            - "33060:3306"
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - hotelpro-net

volumes:
    dbdata:

networks:
    hotelpro-net:
        driver: bridge
